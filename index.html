<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אור — ניהול חופשה</title>
<meta name="theme-color" content="#0C1729">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --color-bg:#0F172A; --color-fg:#FFFFFF; --color-card:#16213E; --color-border:rgba(255,255,255,0.08); --color-secondary:#3B82F6; --color-text-dim:#94A3B8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--color-bg); color:var(--color-fg); font-family:'Noto Sans Hebrew',sans-serif; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--color-card); border:1px solid var(--color-border); border-radius:16px; padding:40px 32px; max-width:440px; text-align:center; }
  .icon { width:56px; height:56px; margin:0 auto 20px; color:var(--color-secondary); }
  h1 { font-size:24px; font-weight:700; margin-bottom:8px; }
  p { color:var(--color-text-dim); font-size:15px; line-height:1.6; }
  .badge { display:inline-block; margin-top:20px; padding:6px 16px; border-radius:999px; background:rgba(59,130,246,0.15); border:1px solid var(--color-secondary); color:var(--color-secondary); font-size:13px; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-1 .1-1.3.5l-.4.6c-.4.6-.2 1.4.4 1.8L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.6 5.6c.4.6 1.2.8 1.8.4l.6-.4c.4-.3.6-.8.5-1.3Z"/></svg>
    <h1>אור — ניהול חופשה</h1>
    <p>תכנון טיולים וחופשות: טיסות, מלונות, מסעדות, השכרת רכב ולוח זמנים יומי, במקום אחד.</p>
    <span class="badge">בקרוב</span>
  </div>
</body>
</html>
