name = "or"
main = "worker.js"
compatibility_date = "2026-07-13"

# Static site, served via the [assets] binding below - index.html at the root is
# the whole app; all its actual data lives in the browser (localStorage) or the
# user's own Google Drive, never here. worker.js is a thin router: it only
# handles the one route that needs real server-side logic (currently just
# /api/link-preview) and hands everything else straight to the static assets.
[assets]
directory = "./"
binding = "ASSETS"
include = ["index.html", "version.json", "terms.html", "privacy.html", "manifest.json", "*.png", "*.ico"]
not_found_handling = "404-page"
# Without this, GET requests are matched against static assets BEFORE
# worker.js's fetch() ever runs, so an unmatched GET path (any /api/* route)
# is answered directly by the assets layer's not_found_handling and never
# reaches the router below - POST requests are unaffected (assets can't serve
# those, so they always reach the Worker) which is exactly why /api/chat
# always worked while a GET-based diagnostic route looked like it was running
# stale code. Set globally (not scoped to "/api/*") since the per-path array
# form didn't change this deploy's behavior - worker.js already forwards
# every non-API path to ASSETS itself, so routing everything through it first
# costs nothing.
run_worker_first = true

# The assistant calls Gemini directly from worker.js using GEMINI_API_KEY.
# No Cloudflare AI binding or provider fallback is configured.
